openapi: 3.0.3
info:
  title: Ski Resort API
  version: 1.0.0
  description: REST API specification for managing visitors and ski passes at a ski resort (Lab 2).
servers:
  - url: http://localhost:5000
    description: Local Development Server

paths:
  /visitors:
    get:
      summary: Get all visitors with pagination
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: Number of records per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A paginated list of visitors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVisitors'
        '400':
          description: Invalid page or size parameters
    post:
      summary: Create a new visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
              required:
                - name
                - email
      responses:
        '201':
          description: Created visitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'

  /visitors/{visitor_id}:
    get:
      summary: Get a specific visitor by ID
      parameters:
        - name: visitor_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Visitor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
        '404':
          description: Visitor not found

  /visitors/{visitor_id}/ski-passes:
    get:
      summary: Get all ski passes for a specific visitor
      parameters:
        - name: visitor_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of ski passes for the visitor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkiPass'
    post:
      summary: Purchase a new ski pass for a visitor
      parameters:
        - name: visitor_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: day
              required:
                - type
      responses:
        '201':
          description: Ski pass successfully purchased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkiPass'

components:
  schemas:
    Visitor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        registration_date:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - email

    SkiPass:
      type: object
      properties:
        id:
          type: integer
        visitor_id:
          type: integer
        type:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
      required:
        - id
        - visitor_id
        - type
        - valid_from
        - valid_to

    PaginationMetadata:
      type: object
      properties:
        current_page:
          type: integer
        page_size:
          type: integer
        total_records:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
      required:
        - current_page
        - page_size
        - total_records
        - total_pages
        - has_next
        - has_prev

    PaginatedVisitors:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Visitor'
      required:
        - metadata
        - data